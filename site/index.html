<script>
(function () {
  /* ── 星空：慢速漂移 + 轻微视差 ── */
  var cv = document.getElementById('stars');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, stars = [], mouseX = 0, mouseY = 0;

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    var n = Math.min(Math.floor(W * H / 9000), 220);
    stars = [];
    for (var i = 0; i < n; i++) {
      var depth = Math.random();
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: depth < 0.86 ? 1 : 2,
        v: 0.012 + depth * 0.05,
        a: 0.18 + Math.random() * 0.55,
        ph: Math.random() * 6.283,
        d: 0.2 + depth * 0.8
      });
    }
  }

  function draw(t) {
    ctx.fillStyle = '#070B12';
    ctx.fillRect(0, 0, W, H);

    // 极淡的星云底
    var g = ctx.createRadialGradient(W * 0.72, H * 0.18, 0, W * 0.72, H * 0.18, Math.max(W, H) * 0.62);
    g.addColorStop(0, 'rgba(41,173,255,0.055)');
    g.addColorStop(1, 'rgba(41,173,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var g2 = ctx.createRadialGradient(W * 0.16, H * 0.82, 0, W * 0.16, H * 0.82, Math.max(W, H) * 0.5);
    g2.addColorStop(0, 'rgba(245,192,66,0.035)');
    g2.addColorStop(1, 'rgba(245,192,66,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      st.y += st.v;
      if (st.y > H) { st.y = -2; st.x = Math.random() * W; }
      var tw = 0.65 + 0.35 * Math.sin(t * 0.0011 + st.ph);
      var ox = (mouseX * st.d) * 6;
      var oy = (mouseY * st.d) * 6;
      ctx.fillStyle = 'rgba(214,235,255,' + (st.a * tw) + ')';
      ctx.fillRect(st.x + ox, st.y + oy, st.s, st.s);
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function (e) {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
  }, { passive: true });

  resize();
  requestAnimationFrame(draw);

  /* ── 版本号：读热更清单，失败就用静态值 ── */
  fetch('/update/version.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.version) return;
      var tag = document.getElementById('verTag');
      var foot = document.getElementById('footVer');
      if (tag) tag.textContent = 'v' + d.version;
      if (foot) foot.textContent = d.version + ' · code ' + d.code;
    })
    .catch(function () { /* 保持静态文案，不报错 */ });

  /* ── QQ 群：首次点击跳转加群，返回后再点则复制群号 ──
     [WHY] 没有 HTTPS，navigator.clipboard 不可用（需安全上下文），
           所以必须带 textarea + execCommand 的降级分支。         */
  var GROUP_NO = '461924852';
  var qqLink = document.getElementById('qqGroup');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  // jumped=true 表示「这一次访问里已经点过链接跳过」
  var jumped = false;
  // 会话标记：点出去时打上，用来区分「真的从 QQ 页退回来」和「从别的站前进回来」
  var MKEY = 'eve_qq_left';
  function markLeft(on) {
    try { on ? sessionStorage.setItem(MKEY, '1') : sessionStorage.removeItem(MKEY); } catch (e) {}
  }
  function hasLeft() {
    try { return sessionStorage.getItem(MKEY) === '1'; } catch (e) { return false; }
  }

  /* 判断本次载入是不是「从别的页面退回来」的。
     [WHY] bfcache 恢复时 JS 变量还在，但整页重载后退回时变量会清零，
           只能靠 navigation type == back_forward 补判；
           再加会话标记，避免从别的站「前进」回来被误判。      */
  (function detectReturn() {
    try {
      var navs = performance.getEntriesByType && performance.getEntriesByType('navigation');
      var t = navs && navs[0] ? navs[0].type : '';
      if (t === 'back_forward') { jumped = hasLeft(); return; }
      if (t === 'navigate' || t === 'reload') { markLeft(false); return; } // 刷新 = 重置
      // 老浏览器兜底：performance.navigation.type，2 = back_forward
      if (performance.navigation && performance.navigation.type === 2) jumped = hasLeft();
    } catch (e) { /* 拿不到就按首次访问处理 */ }
  })();

  // bfcache 恢复（webkit 有时会重新派发 pageshow）
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) jumped = hasLeft();
  });

  function showToast(html) {
    if (!toastEl) return;
    toastEl.innerHTML = html;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2400);
  }

  function copyText(txt) {
    // execCommand 降级分支：[WHY] http 页面没有 navigator.clipboard，
    // 且 clipboard 被浏览器拒绝时也要能复制，所以一律再兜一层。
    function fallback() {
      return new Promise(function (resolve, reject) {
        try {
          var ta = document.createElement('textarea');
          ta.value = txt;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, txt.length);
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('execCommand copy failed'));
        } catch (err) { reject(err); }
      });
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(txt).catch(fallback);
    }
    return fallback();
  }

  if (qqLink) {
    qqLink.addEventListener('click', function (ev) {
      if (!jumped) {
        // 第一次：放行，正常跳到 QQ 加群页，同时打上「已跳出去」的标记
        jumped = true;
        markLeft(true);
        return;
      }
      // 第二次及以后：不再跳转，改为复制群号
      ev.preventDefault();
      copyText(GROUP_NO).then(function () {
        qqLink.classList.add('copied');
        showToast('群号已复制 <b>' + GROUP_NO + '</b>　去 QQ 粘贴搜索');
      }, function () {
        // 复制被浏览器拦住时，至少把号码选中，用户按 Ctrl+C / 长按就能拿走
        try {
          var r = document.createRange();
          r.selectNodeContents(qqLink);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        } catch (e) {}
        showToast('复制被拦截，已选中 <b>' + GROUP_NO + '</b>　按 Ctrl+C / 长按复制');
      });
    });
  }
})();
</script>
